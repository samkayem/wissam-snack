<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة الطلبات | Wissam Snack</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0c09">

<link rel="manifest" href="admin-manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إدارة وسام سناك">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0e0c09; color:#f7f1e1; font-family:'Cairo',sans-serif; direction:rtl; min-height:100vh;}
  .wrap{max-width:960px; margin:0 auto; padding:20px 16px 60px;}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
  h1{font-size:1.3rem; color:#ffd966;}
  .stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .stat{background:#1b170f; border:1px solid #35301f; border-radius:12px; padding:12px 16px; min-width:110px;}
  .stat .n{font-size:1.4rem; font-weight:800; color:#f4b400;}
  .stat .l{font-size:0.75rem; color:#a8977a;}
  .filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filters button{background:#1b170f; border:1px solid #35301f; color:#a8977a; border-radius:999px; padding:7px 14px; font-size:0.82rem; font-weight:700; cursor:pointer; font-family:inherit;}
  .filters button.active{background:#f4b400; color:#1a1204; border-color:#f4b400;}
  .order-card{background:#1b170f; border:1px solid #35301f; border-radius:14px; padding:14px; margin-bottom:12px;}
  .order-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .order-ref{font-weight:800; color:#ffd966;}
  .order-time{font-size:0.75rem; color:#a8977a;}
  .order-status{font-size:0.72rem; font-weight:800; padding:4px 10px; border-radius:999px;}
  .st-new{background:#e85d2c; color:#fff;}
  .st-preparing{background:#f4b400; color:#1a1204;}
  .st-delivering{background:#3b82f6; color:#fff;}
  .st-done{background:#3fae5a; color:#fff;}
  .order-body{margin-top:10px; font-size:0.88rem;}
  .order-body .row{display:flex; gap:6px; margin-bottom:4px;}
  .order-body .row b{color:#a8977a; font-weight:700; min-width:70px;}
  .items-list{margin-top:8px; border-top:1px dashed #35301f; padding-top:8px;}
  .items-list div{font-size:0.85rem; margin-bottom:3px;}
  .order-total{font-weight:800; color:#f4b400; margin-top:6px;}
  .order-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .order-actions button{flex:1; min-width:90px; background:#262015; border:1px solid #35301f; color:#f7f1e1; border-radius:8px; padding:8px; font-size:0.78rem; font-weight:700; cursor:pointer; font-family:inherit;}
  .order-actions button.active{background:#f4b400; color:#1a1204; border-color:#f4b400;}
  .pay-tag{font-size:0.72rem; padding:2px 8px; border-radius:999px; background:#262015; border:1px solid #35301f; display:inline-block;}
  .login-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .login-box{background:#1b170f; border:1px solid #35301f; border-radius:16px; padding:26px; width:100%; max-width:340px; text-align:center;}
  .login-box input{width:100%; background:#262015; border:1px solid #35301f; border-radius:10px; padding:12px; color:#f7f1e1; font-size:1.3rem; text-align:center; letter-spacing:6px; margin:14px 0;}
  .login-box button{width:100%; background:#f4b400; color:#1a1204; border:none; border-radius:10px; padding:12px; font-weight:800; cursor:pointer; font-family:inherit; font-size:0.95rem;}
  .login-error{color:#e85d2c; font-size:0.8rem; margin-top:8px; display:none;}
  .empty{text-align:center; color:#a8977a; padding:40px 0;}
  .refresh-note{font-size:0.75rem; color:#a8977a; text-align:center; margin-bottom:14px;}

  .main-tabs{display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid #35301f; padding-bottom:10px;}
  .main-tabs button{background:none; border:none; color:#a8977a; font-family:inherit; font-size:1rem; font-weight:800; padding:6px 4px; cursor:pointer; border-bottom:3px solid transparent;}
  .main-tabs button.active{color:#ffd966; border-bottom-color:#f4b400;}

  .cat-card{background:#1b170f; border:1px solid #35301f; border-radius:14px; padding:14px; margin-bottom:14px;}
  .cat-head{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .cat-head .cat-name{font-weight:800; color:#ffd966; font-size:1.02rem;}
  .cat-head .cat-actions{display:flex; gap:6px;}
  .icon-btn{background:#262015; border:1px solid #35301f; color:#f7f1e1; border-radius:8px; padding:6px 10px; font-size:0.8rem; cursor:pointer; font-family:inherit;}
  .icon-btn.danger{color:#e85d2c;}
  .item-row{display:flex; gap:8px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px dashed #35301f; flex-wrap:wrap;}
  .item-row input, .item-row select{background:#262015; border:1px solid #35301f; border-radius:8px; padding:8px; color:#f7f1e1; font-family:inherit; font-size:0.85rem;}
  .item-row .f-name{flex:1 1 140px; min-width:120px;}
  .item-row .f-price{width:90px;}
  .item-row .f-tag{width:110px;}
  .item-row label.avail{display:flex; align-items:center; gap:4px; font-size:0.78rem; color:#a8977a; white-space:nowrap;}
  .item-row .row-actions{display:flex; gap:6px; margin-inline-start:auto;}
  .add-cat-form{background:#1b170f; border:1px dashed #f4b400; border-radius:14px; padding:16px; margin-top:10px;}
  .add-cat-form input{width:100%; background:#262015; border:1px solid #35301f; border-radius:8px; padding:9px; color:#f7f1e1; font-family:inherit; font-size:0.85rem; margin-bottom:8px;}
  .add-cat-form .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .primary-wide{width:100%; background:#f4b400; color:#1a1204; border:none; border-radius:10px; padding:11px; font-weight:800; cursor:pointer; font-family:inherit; margin-top:6px;}
  .seed-box{background:#1b170f; border:1px dashed #f4b400; border-radius:14px; padding:20px; text-align:center;}
  .hint{font-size:0.76rem; color:#a8977a; margin-top:4px;}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:2rem;">🔒</div>
    <h1 style="margin-top:8px;">لوحة إدارة الطلبات</h1>
    <input type="password" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
    <button id="loginBtn">دخول</button>
    <div class="login-error" id="loginError">الرمز غير صحيح</div>
  </div>
</div>

<div class="wrap" id="dashboard" style="display:none;">
  <header>
    <h1 id="pageTitle">🧾 طلبات وسام سناك</h1>
    <div style="display:flex; gap:8px;">
      <button id="enableNotifBtn" style="background:#f4b400; color:#1a1204; border:none; border-radius:8px; padding:8px 14px; font-family:inherit; cursor:pointer; font-weight:800;">🔔 تفعيل الإشعارات</button>
      <button onclick="logout()" style="background:#262015; border:1px solid #35301f; color:#f7f1e1; border-radius:8px; padding:8px 14px; font-family:inherit; cursor:pointer;">خروج</button>
    </div>
  </header>

  <div class="main-tabs" id="mainTabs">
    <button class="active" data-tab="orders">📋 الطلبات</button>
    <button data-tab="menu">🍔 المينيو</button>
  </div>

  <div id="ordersTab">
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div class="refresh-note">🔴 تحديث مباشر — الطلبات الجديدة بتظهر تلقائياً</div>
    <div id="ordersList"></div>
  </div>

  <div id="menuTab" style="display:none;">
    <div id="menuSeedBox"></div>
    <div id="menuCategories"></div>
    <div class="add-cat-form" id="addCatForm">
      <div class="cat-head"><span class="cat-name">+ إضافة فئة جديدة</span></div>
      <div class="grid2" style="margin-top:10px;">
        <input type="text" id="newCatAr" placeholder="اسم الفئة (عربي) — مثال: مشروبات">
        <input type="text" id="newCatEn" placeholder="Category name (English) — e.g. Drinks">
      </div>
      <input type="text" id="newCatIcon" placeholder="إيموجي للفئة (اختياري) — مثال: 🥤">
      <button class="primary-wide" id="addCatBtn">حفظ الفئة</button>
      <div class="hint">رقم تعريف الفئة بينولّد تلقائيًا من الاسم الإنجليزي.</div>
    </div>
  </div>
</div>

<audio id="notifSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script src="menu-data.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
