<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة المطبخ | Wissam Snack</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e0c09">

<link rel="manifest" href="kds-manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مطبخ وسام سناك">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#0e0c09; color:#f7f1e1; font-family:'Cairo',sans-serif; direction:rtl; min-height:100vh; overflow-x:hidden;}

  .login-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .login-box{background:#1b170f; border:1px solid #35301f; border-radius:16px; padding:26px; width:100%; max-width:340px; text-align:center;}
  .login-box input{width:100%; background:#262015; border:1px solid #35301f; border-radius:10px; padding:12px; color:#f7f1e1; font-size:1.3rem; text-align:center; letter-spacing:6px; margin:14px 0;}
  .login-box button{width:100%; background:#f4b400; color:#1a1204; border:none; border-radius:10px; padding:12px; font-weight:800; cursor:pointer; font-family:inherit; font-size:0.95rem;}
  .login-error{color:#e85d2c; font-size:0.8rem; margin-top:8px; display:none;}

  header{display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid #35301f; position:sticky; top:0; background:#0e0c09; z-index:10; flex-wrap:wrap; gap:10px;}
  header h1{font-size:1.3rem; color:#ffd966;}
  header .clock{font-size:1.1rem; font-weight:800; color:#f4b400;}
  header button{background:#262015; border:1px solid #35301f; color:#f7f1e1; border-radius:8px; padding:8px 14px; font-family:inherit; cursor:pointer;}

  .board{display:flex; gap:16px; padding:16px; overflow-x:auto; align-items:flex-start;}
  .lane{flex:1 1 320px; min-width:300px; max-width:420px;}
  .lane-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px 12px 0 0; font-weight:900; font-size:1.05rem; position:sticky; top:0; z-index:5;}
  .lane-head.new{background:#e85d2c; color:#fff;}
  .lane-head.preparing{background:#f4b400; color:#1a1204;}
  .lane-head.delivering{background:#3fae5a; color:#0e0c09;}
  .lane-count{background:rgba(0,0,0,0.25); border-radius:999px; padding:2px 10px; font-size:0.9rem;}
  .lane-body{background:#161209; border:1px solid #35301f; border-top:none; border-radius:0 0 12px 12px; min-height:120px; padding:12px; display:flex; flex-direction:column; gap:12px;}

  /* Phones / narrow screens: stack lanes full-width instead of a cramped side-scroll */
  @media (max-width: 860px){
    .board{flex-direction:column; overflow-x:hidden; padding:12px; gap:20px;}
    .lane{flex:1 1 auto; min-width:0; max-width:100%; width:100%;}
    header{padding:12px 14px;}
    header h1{font-size:1.1rem;}
  }

  .order-card{background:#1b170f; border:1px solid #35301f; border-radius:14px; padding:14px; box-shadow:0 4px 14px rgba(0,0,0,0.35);}
  .order-card.urgent{border-color:#e85d2c; box-shadow:0 0 0 1px #e85d2c;}
  .oc-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .oc-ref{font-weight:900; font-size:1.05rem; color:#ffd966;}
  .oc-time{font-size:0.85rem; font-weight:800; color:#a8977a;}
  .oc-time.urgent{color:#e85d2c;}
  .oc-customer{font-size:0.82rem; color:#a8977a; margin-bottom:10px;}

  .oc-item{background:#0e0c09; border:1px solid #262015; border-radius:10px; padding:10px; margin-bottom:8px;}
  .oc-item-name{font-weight:800; font-size:0.92rem; display:flex; justify-content:space-between;}
  .oc-item-qty{background:#f4b400; color:#1a1204; border-radius:6px; padding:1px 8px; font-size:0.85rem; font-weight:900;}
  .oc-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
  .chip{font-size:0.72rem; font-weight:700; padding:3px 8px; border-radius:999px;}
  .chip.bread{background:#3b2a12; color:#ffd966;}
  .chip.removed{background:#3a1210; color:#ff8a75;}
  .chip.sauce{background:#1b2f1e; color:#8fe0a0;}
  .chip.extra{background:#122a3a; color:#7fc4f0;}

  .oc-note{font-size:0.8rem; color:#ffd966; margin-top:6px; background:#2a2210; border-radius:8px; padding:6px 8px;}
  .oc-actions{margin-top:12px;}
  .oc-btn{width:100%; border:none; border-radius:10px; padding:14px; font-weight:900; font-size:0.95rem; cursor:pointer; font-family:inherit;}
  .oc-btn.start{background:#f4b400; color:#1a1204;}
  .oc-btn.ready{background:#3fae5a; color:#0e0c09;}
  .oc-btn.done{background:#262015; color:#a8977a; border:1px solid #35301f;}

  .empty-lane{text-align:center; color:#5a5240; padding:30px 10px; font-size:0.9rem;}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div style="font-size:2rem;">🍳</div>
    <h1 style="margin-top:8px;">شاشة المطبخ</h1>
    <input type="password" id="pinInput" maxlength="6" placeholder="••••" inputmode="numeric">
    <button id="loginBtn">دخول</button>
    <div class="login-error" id="loginError">الرمز غير صحيح</div>
    <a href="admin.html" style="display:block; margin-top:16px; color:#a8977a; font-size:0.82rem; text-decoration:none;">🧾 الرجوع للوحة الإدارة</a>
  </div>
</div>

<div id="board" style="display:none;">
  <header>
    <h1>🍳 مطبخ وسام سناك</h1>
    <div class="clock" id="clock"></div>
    <div style="display:flex; gap:8px;">
      <a href="admin.html" style="background:#262015; border:1px solid #35301f; color:#f7f1e1; border-radius:8px; padding:8px 14px; font-family:inherit; text-decoration:none; display:flex; align-items:center;">🧾 لوحة الإدارة</a>
      <button onclick="logout()">خروج</button>
    </div>
  </header>
  <div class="board">
    <div class="lane">
      <div class="lane-head new">🆕 جديد <span class="lane-count" id="countNew">0</span></div>
      <div class="lane-body" id="laneNew"></div>
    </div>
    <div class="lane">
      <div class="lane-head preparing">🔥 قيد التحضير <span class="lane-count" id="countPreparing">0</span></div>
      <div class="lane-body" id="lanePreparing"></div>
    </div>
    <div class="lane">
      <div class="lane-head delivering">✅ جاهز للتوصيل <span class="lane-count" id="countDelivering">0</span></div>
      <div class="lane-body" id="laneDelivering"></div>
    </div>
  </div>
</div>

<audio id="kdsSound" preload="auto">
  <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
</audio>

<script src="menu-data.js"></script>
<script src="firebase-config.js"></script>
<script src="kds.js"></script>
</body>
</html>
